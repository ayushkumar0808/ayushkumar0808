name: Generate Snake

on:
  schedule:
    - cron: "0 0 * * *"

  workflow_dispatch:

jobs:
  generate:
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Generate Purple Snake
        uses: Platane/snk@v3
        with:
          github_user_name: ayushkumar0808
          outputs: |
            dist/github-contribution-grid-snake.svg?color_snake=%237B2CBF&color_dots=%23F3E8FF,%23E9D5FF,%23D8B4FE,%23B76CF6,%238B2FC9

      - name: Push Snake to Output Branch
        uses: crazy-max/ghaction-github-pages@v5
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
